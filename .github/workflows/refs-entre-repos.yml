name: refs-entre-repos
# propósito: Confere as refs caminho:N (símbolo) das RNs que apontam para outro repo contra a dev do vizinho; a ref nova errada reprova, a já quebrada e a que a PR quebra na doc de outro repo só avisam, com o patch de reancoragem.
# chamador:
#   pull_request:
#     types: [opened, reopened, synchronize]

# REUTILIZÁVEL (workflow_call) — brabo-ci (AT-1029, ADR 0274 itens 3 e 4). Dois
# sentidos no mesmo job (scripts/ci/refs-entre-repos.ts): (a) as refs externas
# das RNs DESTE repo: a que a PR acrescentou ou mudou e não bate REPROVA, a que
# já estava quebrada avisa; (b) as refs das RNs dos vizinhos que apontam para
# ESTE repo: a que batia na base e deixou de bater no head AVISA (a PR moveu o
# código) e sobe o patch `refs-irmaos-patch` para o repo dono da doc. Lê a `dev`
# dos vizinhos por clone raso, sem credencial (repos públicos): não pede
# permissão além de `contents: read`. Não é check obrigatório.
on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'O MESMO SHA de 40 hex do `uses:` do chamador (sem padrão: tag ou ausência rodaria scripts de outra versão)'
        required: true
        type: string
      ci_repo:
        description: 'O repo do brabo-ci de onde vêm os scripts (owner/repo). Só muda num fork; o `uses:` do chamador deve apontar para o mesmo.'
        required: false
        type: string
        default: 'viralabs-dev/brabo-ci'

permissions:
  contents: read

jobs:
  refs:
    name: Refs entre repos
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Histórico inteiro: o script lê a base da PR (merge-base) por `git show`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.ci_repo }}
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: ./.brabo-ci/.github/actions/preparar
        with:
          ci_ref: ${{ inputs.ci_ref }}

      # --escrever reancora as externas no checkout; o código de saída é o do veredito de ANTES.
      - name: Conferir as refs entre repos
        run: node .brabo-ci/scripts/ci/refs-entre-repos.ts --escrever --saida "$RUNNER_TEMP/refs-irmaos-patch" --repo "${GITHUB_REPOSITORY##*/}"

      - name: Patch das refs deste repo
        id: patch
        if: ${{ !cancelled() }}
        run: |
          git diff > "$RUNNER_TEMP/refs-entre-repos.patch"
          if [ -s "$RUNNER_TEMP/refs-entre-repos.patch" ]; then
            echo "tem=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo '### Reancoragem sugerida'
              echo
              echo '```'
              echo "gh run download $GITHUB_RUN_ID -n refs-entre-repos-patch && git apply refs-entre-repos.patch"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir o patch deste repo
        if: ${{ !cancelled() && steps.patch.outputs.tem == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refs-entre-repos-patch
          path: ${{ runner.temp }}/refs-entre-repos.patch

      # Um `brabo-<dono>.patch` por repo cuja doc esta PR quebrou; sem arquivo, nada sobe.
      - name: Subir o patch para os repos donos das docs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refs-irmaos-patch
          path: ${{ runner.temp }}/refs-irmaos-patch
          if-no-files-found: ignore
