name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@64a1e15d5c5fbf46c09385eccf6c70f6bb39cd7e  # dev, merge da ci#19
    with:
      ci_ref: 64a1e15d5c5fbf46c09385eccf6c70f6bb39cd7e  # dev, merge da ci#19
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@64a1e15d5c5fbf46c09385eccf6c70f6bb39cd7e  # dev, merge da ci#19
    with:
      ci_ref: 64a1e15d5c5fbf46c09385eccf6c70f6bb39cd7e  # dev, merge da ci#19
