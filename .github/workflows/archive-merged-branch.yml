name: archive-merged-branch

# REUTILIZÁVEL (workflow_call) — brabo-ci. O chamador declara os gatilhos; veja o README.
# Comentários abaixo vêm do monorepo de origem (daneiel/brabo) e falam dos gatilhos do chamador.

# Toda segunda às 09:00 (Brasília), arquiva a branch mergeada sem commit depois
# do merge — exceto dev, main (permanentes), qa (aposentada) e gh-pages (deploy do site de docs). "Arquivar" é
# mecânico: mover de `refs/heads/<nome>` para `refs/archive/<nome>`, nunca
# apagar — o objeto e o histórico continuam no repositório, recuperável por
# quem souber o ref. Fonte da política: docs/explanation/branching-policy.md
#
# A decisão (quem é apta e por quê) e a chamada à API moram em
# scripts/ci/archive-branch.ts; o resumo do job lista arquivadas, mantidas com
# o motivo e falhas, e o job sai vermelho se houver falha.
on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'O MESMO SHA de 40 hex do `uses:` do chamador (sem padrão: tag ou ausência rodaria scripts de outra versão)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: archive-merged-branch
  cancel-in-progress: false

jobs:
  arquivar:
    name: Arquivar branches mergeadas
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Os scripts da política moram no brabo-ci, não no repositório que chama.
      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-ci
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: ./.brabo-ci/.github/actions/preparar
        with:
          ci_ref: ${{ inputs.ci_ref }}

      - name: Decidir e arquivar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .brabo-ci/scripts/ci/archive-branch.ts
