name: arestas-alinhadas
# propósito: Prova que cada aresta do repos.yml do brabo existe no código (prova arquivo + trecho) e que REPOS, irmaos.lock e componentes.json batem com o mapa.
# chamador:
#   schedule:
#     - cron: '0 9 * * 1'
#   workflow_dispatch:

# REUTILIZÁVEL (workflow_call) — brabo-ci (AT-825 parte b, ADR 0281). Lê os arquivos da `dev` de cada repo por
# raw.githubusercontent.com (repos públicos, sem segredo) e roda `scripts/ci/arestas-dos-repos.ts`.
# Nasce INFORMATIVO: não é check obrigatório. A prova é sobre a `dev`, não sobre o PR do chamador.
on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'O MESMO SHA de 40 hex do `uses:` do chamador (sem padrão: tag ou ausência rodaria scripts de outra versão)'
        required: true
        type: string
      ci_repo:
        description: 'O repo do brabo-ci de onde vêm os scripts (owner/repo). Só muda num fork; o `uses:` do chamador deve apontar para o mesmo.'
        required: false
        type: string
        default: 'viralabs-dev/brabo-ci'

permissions:
  contents: read

jobs:
  conferir:
    name: Arestas alinhadas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.ci_repo }}
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: ./.brabo-ci/.github/actions/preparar
        with:
          ci_ref: ${{ inputs.ci_ref }}
          dependencias: true

      - name: Arestas do repos.yml provadas
        run: node .brabo-ci/scripts/ci/arestas-dos-repos.ts
