name: approval-ladder
# propósito: Exige as aprovações certas de cada degrau (dev ou main) conforme o modo solo ou community; dispensa a PR do Dependabot e a de regeneração do bot na dev.
# chamador:
#   pull_request:
#     types: [opened, edited, reopened, synchronize, ready_for_review]
#   pull_request_review:
#     types: [submitted, edited, dismissed]

# REUTILIZÁVEL (workflow_call) — brabo-ci. O chamador declara os gatilhos; veja o README.
# Comentários abaixo vêm do monorepo de origem (`viralabs-dev/brabo-legacy`, arquivado) e falam dos gatilhos do chamador.

# Exige as aprovações certas para cada degrau da escada.
# Fonte da política: scripts/ci/docs/explanation/branching-policy.md
# A lógica vive em scripts/ci/approval-ladder.ts, testada por vitest.
#
# O pr-police diz se o PR está no LUGAR certo; este diz se ele tem as
# APROVAÇÕES certas. Os dois não conversam de propósito: este NÃO lê a label
# que o pr-police escreve. Se lesse, quem pudesse editar label mudaria o regime
# de aprovação, e haveria corrida entre os dois workflows.
#
# `pull_request` e NÃO `pull_request_target`, ao contrário do pr-police: aqui o
# job só LÊ reviews e não escreve label nenhuma, então o token read-only de um
# PR de fork basta. Menos permissão, menos superfície.
on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'O MESMO SHA de 40 hex do `uses:` do chamador (sem padrão: tag ou ausência rodaria scripts de outra versão)'
        required: true
        type: string
      ci_repo:
        description: 'O repo do brabo-ci de onde vêm os scripts (owner/repo). Só muda num fork; o `uses:` do chamador deve apontar para o mesmo.'
        required: false
        type: string
        default: 'viralabs-dev/brabo-ci'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: approval-ladder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  escada:
    name: Escada de aprovação
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # ATENÇÃO: sem `if:` neste job, nunca. Status check é indexado por
      # (sha, nome do check). Um job que se pule deixa o veredito antigo colado
      # no sha, e a proteção de branch aceita — buraco silencioso.
      #
      # `synchronize` está nos gatilhos porque push novo INVALIDA os reviews
      # anteriores: sem ele, uma aprovação de commit velho seguiria valendo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Os scripts da política moram no brabo-ci, não no repositório que chama.
      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.ci_repo }}
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: ./.brabo-ci/.github/actions/preparar
        with:
          ci_ref: ${{ inputs.ci_ref }}

      - name: Avaliar a escada
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTOR: ${{ github.event.pull_request.user.login }}
          PR_AUTOR_TIPO: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # O modo e os aprovadores são VARIÁVEIS de repositório — trocar de
          # solo para community é mudar isto aqui, sem tocar em código.
          APPROVAL_MODE: ${{ vars.APPROVAL_MODE || 'solo' }}
          OWNER_HANDLE: ${{ vars.OWNER_HANDLE }}
          APROVADORES_DEVS: ${{ vars.APROVADORES_DEVS }}
          APROVADORES_QUALIDADE: ${{ vars.APROVADORES_QUALIDADE }}
          APROVADORES_PO: ${{ vars.APROVADORES_PO }}
          APROVADORES_GESTAO: ${{ vars.APROVADORES_GESTAO }}
        run: node .brabo-ci/scripts/ci/approval-ladder.ts
