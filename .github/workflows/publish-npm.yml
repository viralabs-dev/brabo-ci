name: publish-npm

# REUTILIZÁVEL (workflow_call) — brabo-ci (AT-770). Publica pacotes npm no GitHub
# Packages a partir da tag do chamador: `pnpm pack`, atesta o `.tgz` com
# `actions/attest` e publica ESSE MESMO arquivo. Sem `--provenance`: o npm só o
# documenta para o npmjs.org. O chamador dispara com `on: push: tags: ['v*']`.
# Os pacotes saem com a versão da tag; `-dev.N` vai para o dist-tag `dev`, a
# final para `latest`. Republicar a mesma versão é sucesso se a integridade bater.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag que dispara a publicação (vX.Y.Z ou vX.Y.Z-dev.N)'
        required: true
        type: string
      pacotes:
        description: 'Diretórios dos pacotes, um por linha (ex.: packages/shared)'
        required: true
        type: string
      ci_ref:
        description: 'Ref do brabo-ci de onde vêm os scripts (use o MESMO SHA do `uses:` do chamador)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publicar:
    name: Publicar no GitHub Packages
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      REGISTRY: https://npm.pkg.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: viralabs-dev/brabo-ci
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.10.0
          registry-url: https://npm.pkg.github.com
          scope: '@viralabs-dev'

      - name: Versão e dist-tag da tag
        id: tag
        run: node .brabo-ci/scripts/ci/publish-npm.ts "$TAG"
        env:
          TAG: ${{ inputs.tag }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Empacotar
        env:
          PACOTES: ${{ inputs.pacotes }}
          VERSAO: ${{ steps.tag.outputs.versao }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tgz"
          printf '%s\n' "$PACOTES" | while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            (cd "$dir" && npm version "$VERSAO" --no-git-tag-version --allow-same-version >/dev/null \
              && pnpm pack --pack-destination "$RUNNER_TEMP/tgz")
          done
          ls -l "$RUNNER_TEMP/tgz"

      - name: Atestar os .tgz
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tgz/*.tgz

      - name: Publicar os mesmos .tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP"/tgz/*.tgz; do
            if npm publish "$tgz" --tag "$DIST_TAG" --registry "$REGISTRY"; then continue; fi
            # Republicação: só é sucesso se o registry já guarda ESTE arquivo.
            nome="$(tar -xOzf "$tgz" package/package.json | node -p 'const p=JSON.parse(require("fs").readFileSync(0));p.name+"@"+p.version')"
            local_="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            remoto="$(npm view "$nome" dist.integrity --registry "$REGISTRY" || true)"
            if [ "$local_" != "$remoto" ]; then
              echo "::error title=publish-npm::$nome já existe com outra integridade"
              exit 1
            fi
            echo "::notice::$nome já estava publicado com a mesma integridade"
          done
