name: ci

# Testa o próprio brabo-ci: vitest dos scripts de política, typecheck e o pin
# por SHA dos workflows (inclusive os reutilizáveis que ele publica).
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Instalar o actionlint
        run: |
          curl -fsSL -o /tmp/al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
      - run: /tmp/actionlint -color
      # O exemplo de chamada de cada página gerada também tem de passar no actionlint.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: actionlint nos exemplos de chamada
        run: |
          node scripts/ci/referencia-dos-workflows.ts --exemplos /tmp/exemplos
          /tmp/actionlint -color -config-file .github/actionlint.yaml /tmp/exemplos/*.yml
  shell:
    name: shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (binário v0.10.0 conferido por sha256)
        run: |
          curl -fsSL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          ./shellcheck-v0.10.0/shellcheck --shell=bash scripts/ci/*.sh
  segredos:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks na árvore (binário conferido por sha256)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact
  testar:
    name: Testes, tipos e pins
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm actions:pinadas
      - name: preparar instala fora do workspace do chamador (AT-841)
        run: |
          d=$(mktemp -d)
          printf 'packages:\n  - "."\n' > "$d/pnpm-workspace.yaml"
          echo '{"name":"chamador","private":true}' > "$d/package.json"
          mkdir "$d/.brabo-ci"
          cp package.json pnpm-lock.yaml "$d/.brabo-ci/"
          (cd "$d/.brabo-ci" && pnpm install --prod --ignore-scripts --frozen-lockfile --ignore-workspace)
          test -d "$d/.brabo-ci/node_modules/yaml"
      - name: Referência dos workflows em dia (gerada do YAML)
        run: node scripts/ci/referencia-dos-workflows.ts --check
