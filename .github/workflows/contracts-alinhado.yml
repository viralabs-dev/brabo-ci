name: contracts-alinhado
# propósito: Confere que a versão do brabo-contracts é a mesma no package.json, no lock e nos scripts de download; só avisa se difere do componentes.json do brabo.
# chamador:
#   pull_request:
#     types: [opened, reopened, synchronize]

# REUTILIZÁVEL (workflow_call) — brabo-ci (AT-770, RN-1038). Confere que a versão
# do brabo-contracts é a mesma no alias do `package.json`, no lock e nas constantes
# dos scripts de download. Avisa (sem falhar) se difere do `componentes.json` do
# brabo. Não é check obrigatório.
on:
  workflow_call:
    inputs:
      ci_ref:
        description: 'O MESMO SHA de 40 hex do `uses:` do chamador (sem padrão: tag ou ausência rodaria scripts de outra versão)'
        required: true
        type: string
      ci_repo:
        description: 'O repo do brabo-ci de onde vêm os scripts (owner/repo). Só muda num fork; o `uses:` do chamador deve apontar para o mesmo.'
        required: false
        type: string
        default: 'viralabs-dev/brabo-ci'

permissions:
  contents: read

jobs:
  conferir:
    name: Contracts alinhado
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts do brabo-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.ci_repo }}
          ref: ${{ inputs.ci_ref }}
          path: .brabo-ci
          persist-credentials: false

      - uses: ./.brabo-ci/.github/actions/preparar
        with:
          ci_ref: ${{ inputs.ci_ref }}

      - run: node .brabo-ci/scripts/ci/contracts-alinhado.ts
